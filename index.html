<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #1e272e;
      color: #d2dae2;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .game-card {
      background-color: #2c3e50;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 2px solid #485460;
    }

    h1 {
      margin-top: 0;
      color: #00d8d6;
      letter-spacing: 1px;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
    }

    .input-group {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    input[type="number"] {
      width: 100px;
      padding: 10px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      text-align: center;
      outline: none;
    }

    /* Remove spinner arrows from number input */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #0be881;
      color: #1e272e;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #05c46b;
    }

    button:active {
      transform: scale(0.98);
    }

    #resetBtn {
      background-color: #ffdd59;
      display: none;
      margin: 15px auto 0 auto;
    }

    #resetBtn:hover {
      background-color: #ffd32a;
    }

    .message {
      font-size: 18px;
      font-weight: bold;
      min-height: 25px;
      margin: 15px 0;
    }

    .stats {
      background-color: #34495e;
      padding: 15px;
      border-radius: 5px;
      font-size: 14px;
      text-align: left;
    }

    .stats p {
      margin: 5px 0;
    }

    .high { color: #ff5e57; }
    .low { color: #00d8d6; }
    .win { color: #0be881; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>Guess the Number</h1>
    <p>I'm thinking of a secret number between <strong>1 and 100</strong>. Can you guess it in 10 attempts or less?</p>

    <div class="input-group">
      <input type="number" id="guessInput" min="1" max="100" placeholder="1-100" autofocus>
      <button id="guessBtn">Guess</button>
    </div>

    <div id="message" class="message"></div>

    <div class="stats">
      <p><strong>Attempts Left:</strong> <span id="attempts">10</span></p>
      <p><strong>Previous Guesses:</strong> <span id="history">None</span></p>
    </div>

    <button id="resetBtn">Play Again</button>
  </div>

  <script>
    // Game variables
    let randomNumber;
    let attemptsLeft;
    let guessHistory;

    // DOM Elements
    const guessInput = document.getElementById('guessInput');
    const guessBtn = document.getElementById('guessBtn');
    const resetBtn = document.getElementById('resetBtn');
    const message = document.getElementById('message');
    const attemptsDisplay = document.getElementById('attempts');
    const historyDisplay = document.getElementById('history');

    // Initialize/Reset the game
    function initGame() {
      randomNumber = Math.floor(Math.random() * 100) + 1;
      attemptsLeft = 10;
      guessHistory = [];

      guessInput.disabled = false;
      guessInput.value = '';
      guessBtn.disabled = false;
      resetBtn.style.display = 'none';

      message.innerText = '';
      message.className = 'message';
      attemptsDisplay.innerText = attemptsLeft;
      historyDisplay.innerText = 'None';
      
      guessInput.focus();
    }

    // Handle a guess submission
    function checkGuess() {
      const userGuess = parseInt(guessInput.value);

      // Validate input
      if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
        message.innerText = 'Please enter a valid number between 1 and 100!';
        message.className = 'message high';
        return;
      }

      // Prevent guessing the exact same number twice
      if (guessHistory.includes(userGuess)) {
        message.innerText = 'You already guessed that number!';
        message.className = 'message';
        return;
      }

      // Update state
      guessHistory.push(userGuess);
      attemptsLeft--;
      attemptsDisplay.innerText = attemptsLeft;
      historyDisplay.innerText = guessHistory.join(', ');

      // Check win/lose conditions
      if (userGuess === randomNumber) {
        message.innerText = `🎉 Correct! The number was ${randomNumber}.`;
        message.className = 'message win';
        endGame();
      } else if (attemptsLeft === 0) {
        message.innerText = `💥 Game Over! The secret number was ${randomNumber}.`;
        message.className = 'message high';
        endGame();
      } else if (userGuess > randomNumber) {
        message.innerText = '📉 Too High! Try a lower number.';
        message.className = 'message high';
      } else {
        message.innerText = '📈 Too Low! Try a higher number.';
        message.className = 'message low';
      }

      guessInput.value = '';
      guessInput.focus();
    }

    // Lock controls when game ends
    function endGame() {
      guessInput.disabled = true;
      guessBtn.disabled = true;
      resetBtn.style.display = 'block';
    }

    // Event Listeners
    guessBtn.addEventListener('click', checkGuess);

    // Allow pressing "Enter" in the input field to submit
    guessInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !guessBtn.disabled) {
        checkGuess();
      }
    });

    resetBtn.addEventListener('click', initGame);

    // Start the game on page load
    initGame();
  </script>
</body>
</html>
