<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Snake Game</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #2c3e50;
      color: #ecf0f1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h1 {
      margin: 0 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #score-board {
      font-size: 24px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    canvas {
      background-color: #34495e;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 4px solid #bdc3c7;
      border-radius: 5px;
    }

    .instructions {
      margin-top: 20px;
      font-size: 14px;
      color: #bdc3c7;
    }
  </style>
</head>
<body>

  <h1>Snake</h1>
  <div id="score-board">Score: <span id="score">0</span></div>
  
  <!-- The game grid is 400x400. With a 20px grid, that's 20x20 squares -->
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="instructions">Use <strong>Arrow Keys</strong> to move.</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    // Game grid size and initial frame rate controller
    const gridSize = 20;
    let count = 0;
    let score = 0;

    // Snake object definition
    let snake = {
      x: 160,
      y: 160,
      dx: gridSize, // moves one grid right initially
      dy: 0,
      cells: [], // Tracks the segments of the snake body
      maxCells: 4 // Starting length
    };

    // Apple object definition
    let apple = {
      x: 320,
      y: 320
    };

    // Helper function to get random integer within a range
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    // Reset game state when you hit a wall or yourself
    function resetGame() {
      snake.x = 160;
      snake.y = 160;
      snake.cells = [];
      snake.maxCells = 4;
      snake.dx = gridSize;
      snake.dy = 0;
      score = 0;
      scoreElement.innerText = score;
      placeApple();
    }

    // Move the apple to a random grid position
    function placeApple() {
      apple.x = getRandomInt(0, canvas.width / gridSize) * gridSize;
      apple.y = getRandomInt(0, canvas.height / gridSize) * gridSize;
    }

    // Main game loop
    function loop() {
      requestAnimationFrame(loop);

      // Throttle frame rate to roughly 10-15 fps for classic snake speed
      if (++count < 6) {
        return;
      }
      count = 0;

      // Clear the canvas for the next frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Move snake by its velocity
      snake.x += snake.dx;
      snake.y += snake.dy;

      // Collision Detection: Walls
      // If the snake hits the edge of the screen, reset the game
      if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) {
        resetGame();
      }

      // Keep track of where the snake has been (front of the array is the head)
      snake.cells.unshift({x: snake.x, y: snake.y});

      // Remove the tail if we haven't eaten an apple
      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      // Draw the apple
      ctx.fillStyle = '#e74c3c'; // Red
      ctx.fillRect(apple.x, apple.y, gridSize - 1, gridSize - 1);

      // Draw the snake
      ctx.fillStyle = '#2ecc71'; // Green
      snake.cells.forEach(function(cell, index) {
        // Draw each segment slightly smaller than the grid size to show gaps
        ctx.fillRect(cell.x, cell.y, gridSize - 1, gridSize - 1);

        // Check if the snake ate the apple
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          score += 10;
          scoreElement.innerText = score;
          placeApple();
        }

        // Collision Detection: Self
        // Check if the current head (index 0) has collided with any other body part
        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            resetGame();
          }
        }
      });
    }

    // Keyboard event listener to change direction
    document.addEventListener('keydown', function(e) {
      // Prevent the snake from reversing directly into itself
      // Left arrow
      if (e.key === 'ArrowLeft' && snake.dx === 0) {
        snake.dx = -gridSize;
        snake.dy = 0;
      }
      // Up arrow
      else if (e.key === 'ArrowUp' && snake.dy === 0) {
        snake.dy = -gridSize;
        snake.dx = 0;
      }
      // Right arrow
      else if (e.key === 'ArrowRight' && snake.dx === 0) {
        snake.dx = gridSize;
        snake.dy = 0;
      }
      // Down arrow
      else if (e.key === 'ArrowDown' && snake.dy === 0) {
        snake.dy = gridSize;
        snake.dx = 0;
      }
    });

    // Start the game loop
    requestAnimationFrame(loop);
  </script>
</body>
</html>
